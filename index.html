<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <main class="container">
        <div class="header">
            <p id="title">EXPENSE TRACKER</p>
            <p id="caption">Track you spending...</p>
        </div>

        <div class="total-expense">
            <p>Total Expenses: </p>
            <span id="total">$0</span>
        </div>

        <button id="new-btn">New Expense</button>

        <div class="modal" id="modal">
            <div class="modal-content">
                <h1>New Expense</h1>
                    <form id="expense-form">
                        <input type="date" id="date" required>
                        <input type="text" id="description" placeholder="Description" maxlength="50" required>
                        <input type="number" id="amount" placeholder="Amount" step="0.01" min="1" max="" required>
                        <select id="category" required>
                            <option value="">Category</option>
                            <option value="Food">Food</option>
                            <option value="Dining">Dining</option>
                            <option value="Total">Transportation</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Health">Health</option>
                            <option value="Other">Other</option>
                        </select>
                        <div class="buttons">
                            <button type="submit" id="add-btn">Add Expense</button>
                            <button type="button" id="cancel-btn">Cancel</button>
                        </div>
                    </form>
            </div>
        </div>

        <div class="table-wrapper">
            <h2>Recent Expenses</h2>
            <table id="expenses">
                <tr class="table-header">
                    <th>Date</th>
                    <th>Description</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Action</th>
                </tr>
                <tbody id="expense-data"></tbody>
            </table>
        </div>
    </main>
</body>

</html>
